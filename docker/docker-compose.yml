name: events-project
services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ../application:/var/www/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - events-project

  php:
    build:
      context: ./php
      dockerfile: Dockerfile
    volumes:
      - ../application:/var/www/html
      - composer_home:/home/www-data
      - ./php/php.ini:/etc/php/8.5/fpm/php.ini:ro
      - ./php/php-cli.ini:/etc/php/8.5/cli/php.ini:ro
      - ./php/conf.d/xdebug.ini:/etc/php/8.5/fpm/conf.d/99-xdebug.ini:ro
      - ./php/conf.d/xdebug.ini:/etc/php/8.5/cli/conf.d/99-xdebug.ini:ro
      - ./php/pool.d/zz-docker.conf:/etc/php/8.5/fpm/pool.d/zz-docker.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      PHP_IDE_CONFIG: "serverName=events-project"
      HOME: /home/www-data
      COMPOSER_HOME: /home/www-data/.composer
      COMPOSER_CACHE_DIR: /home/www-data/.cache/composer
      XDG_CONFIG_HOME: /home/www-data/.config
      XDG_CACHE_HOME: /home/www-data/.cache
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-events-project}
      DB_USER: ${POSTGRES_USER:-events-project}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-secret}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - events-project

  db:
    image: postgres:17
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-events-project}
      POSTGRES_USER: ${POSTGRES_USER:-events-project}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init-schema.sql:/docker-entrypoint-initdb.d/init-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-events-project} -d ${POSTGRES_DB:-events-project}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - events-project
  redis:
    image: redis:8.8.1-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:-secret} --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - events-project
  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "${MAILHOG_PORT:-8025}:8025" # Web UI port
    logging:
      driver: 'none'
    networks:
      - events-project
volumes:
  postgres_data:
  composer_home:
  redis_data:

networks:
  events-project:
    driver: bridge
